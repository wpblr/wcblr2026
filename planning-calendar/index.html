<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in</title>
<style>
  :root{
    --bg:#F2ECE0; --card:#FBF8F1; --ink:#2a1d14; --muted:#7a6757; --faint:#a89a8b;
    --line:#ddd9d2; --red:#C8344B; --gold:#a8760f; --green:#1d8b6e;
    --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --shadow: 0 1px 2px rgba(42,29,20,.06), 0 12px 40px rgba(42,29,20,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #fff8ea 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:400px; background:var(--card);
    border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow);
    padding:34px 30px 28px;
  }
  .lock{
    width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
    background:#fff; border:1px solid var(--line); margin:0 auto 16px; font-size:22px;
  }
  h1{font-size:1.1rem; text-align:center; margin:0 0 22px; letter-spacing:.2px; font-weight:600}
  label{display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); margin:0 0 6px; font-family:var(--mono)}
  .field{margin-bottom:16px}
  input{
    width:100%; padding:12px 13px; font-size:1rem; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:11px; outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(224,165,38,.18)}
  button{
    width:100%; padding:12px 16px; font-size:1rem; font-weight:600; color:#fff;
    background:var(--red); border:0; border-radius:11px; cursor:pointer; margin-top:4px;
    transition:filter .15s, transform .05s;
  }
  button:hover{filter:brightness(1.05)} button:active{transform:translateY(1px)}
  button:disabled{opacity:.65; cursor:default}
  .err{color:var(--red); font-size:.85rem; text-align:center; min-height:20px; margin-top:12px}
  .foot{text-align:center; color:var(--faint); font-size:.72rem; margin-top:18px; font-family:var(--mono)}
  @media (prefers-color-scheme: dark){
    :root{--bg:#1c140d; --card:#251a11; --ink:#F2ECE0; --muted:#b7a692; --faint:#7a6757; --line:#3a2b1f}
    body{background:radial-gradient(1200px 600px at 50% -10%, #33240f 0%, transparent 60%), var(--bg)}
    .lock{background:#2f2115}
    input{background:#2f2115; color:var(--ink)}
  }
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <div class="lock">&#128274;</div>
    <h1>Sign in</h1>
    <div class="field">
      <label for="u">Username</label>
      <input id="u" name="u" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="p">Password</label>
      <input id="p" name="p" type="password" required>
    </div>
    <button id="go" type="submit">Continue</button>
    <div class="err" id="err" role="alert"></div>
  </form>

  function b64ToBytes(b64){
    var bin = atob(b64), u = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  async function deriveKey(pass, salt, iter){
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:salt, iterations:iter, hash:"SHA-256" },
      base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  }
  var form = document.getElementById("form");
  var btn = document.getElementById("go");
  var errEl = document.getElementById("err");

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    errEl.textContent = "";
    var u = document.getElementById("u").value.trim();
    var p = document.getElementById("p").value.trim();
    if (!u || !p){ errEl.textContent = "Enter your username and password."; return; }
    btn.disabled = true; btn.textContent = "Please wait…";
    try{
      var key = await deriveKey(u + "\n" + p, b64ToBytes(CFG.salt), CFG.iter);
      var buf = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64ToBytes(CFG.iv) }, key, b64ToBytes(CFG.ct));
      var html = new TextDecoder().decode(buf);
      document.open(); document.write(html); document.close();
    }catch(err){
      btn.disabled = false; btn.textContent = "Continue";
      errEl.textContent = "Incorrect username or password.";
      document.getElementById("p").value = "";
      document.getElementById("p").focus();
    }
  });
