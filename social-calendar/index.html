<title>WCBLR 2026 · Social &amp; Blog Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F2ECE0;--card:#FBF8F1;--ink:#2a1d14;--muted:#7a6757;--line:#dad5cd;--red:#C8344B;--gold:#a8760f;--gold-bright:#E0A526;--panel:#2a1d14;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--display:"Fraunces",Georgia,serif;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:24px}
  .gate{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(42,29,20,.06),0 12px 34px rgba(42,29,20,.08);padding:30px 28px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--red);text-transform:lowercase;margin:0 0 10px}
  h1{font-family:var(--display);font-weight:500;font-size:1.55rem;line-height:1.1;margin:0 0 6px}
  h1 em{font-style:italic;color:var(--red)}
  p.sub{color:var(--muted);font-size:.9rem;margin:0 0 20px}
  label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  input{width:100%;font-family:var(--sans);font-size:1rem;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;transition:.15s}
  input:focus{border-color:var(--red)}
  button{width:100%;margin-top:20px;font-family:var(--sans);font-weight:700;font-size:.98rem;color:#fff;background:var(--red);border:none;border-radius:999px;padding:12px;cursor:pointer;transition:.15s}
  button:hover{filter:brightness(1.04)}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--red);font-size:.86rem;margin-top:14px;min-height:1.1em;text-align:center}
  .foot{margin-top:18px;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:#a89a8b}
</style></head>
<body>
  <form class="gate" id="gate" autocomplete="off">
    <p class="eyebrow">wcblr 2026 · comms</p>
    <h1>Social &amp; blog <em>calendar</em></h1>
    <p class="sub">This planner is for the WCBLR Communications team. Sign in to open it.</p>
    <label for="u">Username</label>
    <input id="u" type="text" autocomplete="username" autofocus>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password">
    <button type="submit" id="go">Open the calendar</button>
    <div class="err" id="err"></div>
    <div class="foot">Encrypted in your browser. Nothing is stored.</div>
  </form>

  function b64ToBuf(b64){ var bin=atob(b64); var u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u.buffer; }
  var form=document.getElementById("gate"), err=document.getElementById("err"), go=document.getElementById("go");
  form.addEventListener("submit", async function(e){
    e.preventDefault();
    err.textContent=""; go.disabled=true; go.textContent="Opening...";
    var u=document.getElementById("u").value, p=document.getElementById("p").value;
    try{
      var enc=new TextEncoder();
      var km=await crypto.subtle.importKey("raw", enc.encode(u+"\u0000"+p), {name:"PBKDF2"}, false, ["deriveKey"]);
      var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64ToBuf(DATA.salt),iterations:DATA.iter,hash:"SHA-256"}, km, {name:"AES-GCM",length:256}, false, ["decrypt"]);
      var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBuf(DATA.iv)}, key, b64ToBuf(DATA.ct));
      var html=new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
    }catch(ex){
      go.disabled=false; go.textContent="Open the calendar";
      err.textContent="Incorrect username or password.";
    }
  });
